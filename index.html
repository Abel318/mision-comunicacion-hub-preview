<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Misión Comunicación · Preview del hub</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0e1719;font-family:Inter,system-ui,Segoe UI,sans-serif}
  #renderCanvas{width:100%;height:100%;touch-action:none;display:block}
  .overlay{position:fixed;inset:0;pointer-events:none;color:#f2f1e8}
  .brand{position:absolute;left:28px;top:24px;font-weight:650;letter-spacing:.02em}
  .brand small{display:block;margin-top:3px;font-size:10px;letter-spacing:.18em;opacity:.66}
  .intro{position:absolute;left:28px;top:84px;max-width:330px;padding:14px 16px;border-radius:14px;background:rgba(9,20,23,.42);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.10)}
  .intro .eyebrow{font-size:9px;letter-spacing:.22em;opacity:.72}
  .intro h1{font-size:24px;line-height:1.08;margin:8px 0 7px;font-weight:620}
  .intro p{font-size:12px;line-height:1.35;opacity:.82;margin:0}
  .controls{position:absolute;left:28px;bottom:22px;font-size:12px;opacity:.78}
  .badge{position:absolute;right:24px;top:22px;padding:8px 11px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(12,23,26,.5);font-size:12px}
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div class="overlay">
  <div class="brand">Misión Comunicación<small>PREVIEW VISUAL DEL HUB</small></div>
  <div class="intro">
    <div class="eyebrow">ELIGE TU EXPERIENCIA</div>
    <h1>Tres situaciones.<br>Tu manera de comunicar.</h1>
    <p>Prueba visual pública temporal de la rama dev. No incluye IA, voz ni datos reales.</p>
  </div>
  <div class="controls">WASD o flechas: caminar · arrastrar con el ratón: mirar</div>
  <div class="badge">Preview · dev</div>
</div>
<script>
const canvas=document.getElementById("renderCanvas");
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true});
engine.setHardwareScalingLevel(Math.max(1,window.devicePixelRatio/1.5));
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.055,.085,.095,1);
scene.imageProcessingConfiguration.toneMappingEnabled=true;
scene.imageProcessingConfiguration.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
scene.imageProcessingConfiguration.exposure=1.08;
scene.imageProcessingConfiguration.contrast=1.12;

const camera=new BABYLON.UniversalCamera("Cámara",new BABYLON.Vector3(-1,1.65,-4.2),scene);
camera.minZ=.1;camera.fov=1.26;camera.attachControl(canvas,true);
camera.speed=.18;camera.angularSensibility=3500;
camera.keysUp=[87,38];camera.keysDown=[83,40];camera.keysLeft=[65,37];camera.keysRight=[68,39];

const mat=(name,color,rough=.7,metal=0)=>{const m=new BABYLON.PBRMaterial(name,scene);m.albedoColor=BABYLON.Color3.FromHexString(color);m.roughness=rough;m.metallic=metal;return m};
const patterned=(name,color,rough,kind)=>{
  const m=mat(name,color,rough);
  const t=new BABYLON.DynamicTexture(name+" textura",{width:512,height:512},scene,false);
  const g=t.getContext();g.fillStyle=color;g.fillRect(0,0,512,512);
  if(kind==="stone"){
    g.globalAlpha=.12;g.strokeStyle="#ffffff";g.lineWidth=2;
    for(let i=0;i<22;i++){const y=(i*67)%512;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(120,y-18,330,y+20,512,y-8);g.stroke()}
    g.globalAlpha=.09;g.fillStyle="#243235";for(let i=0;i<95;i++){const x=(i*83)%512,y=(i*137)%512,r=1+(i%4);g.fillRect(x,y,r,r)}
  }else if(kind==="wood"){
    g.globalAlpha=.20;for(let i=0;i<38;i++){const x=(i*29)%512;g.strokeStyle=i%3===0?"#2f1e15":"#d5a16f";g.lineWidth=1+(i%3);g.beginPath();g.moveTo(x,0);g.bezierCurveTo(x+12,150,x-10,350,x+8,512);g.stroke()}
  }else if(kind==="floor"){
    g.globalAlpha=.17;g.strokeStyle="#d5dcda";g.lineWidth=2;for(let i=0;i<=512;i+=128){g.beginPath();g.moveTo(i,0);g.lineTo(i,512);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(512,i);g.stroke()}
    g.globalAlpha=.08;g.fillStyle="#ffffff";for(let i=0;i<140;i++){const x=(i*71)%512,y=(i*131)%512;g.fillRect(x,y,2,2)}
  }else{
    g.globalAlpha=.10;g.strokeStyle="#ffffff";g.lineWidth=1;for(let i=0;i<512;i+=8){g.beginPath();g.moveTo(0,i);g.lineTo(512,i);g.stroke()}
  }
  g.globalAlpha=1;t.update();t.wrapU=BABYLON.Texture.WRAP_ADDRESSMODE;t.wrapV=BABYLON.Texture.WRAP_ADDRESSMODE;
  if(kind==="floor"){t.uScale=4;t.vScale=5}else if(kind==="wood"){t.uScale=2;t.vScale=2}else{t.uScale=2;t.vScale=3}
  m.albedoTexture=t;return m;
};
const wall=patterned("Piedra clara","#c9ceca",.86,"stone"), floor=patterned("Pavimento mineral","#667174",.26,"floor"), oak=patterned("Madera nogal","#76543f",.50,"wood"), graphite=mat("Aluminio oscuro","#263c43",.28,.66), teal=mat("Panel acústico","#24464f",.58), brass=mat("Latón","#c5b181",.24,.72), soft=patterned("Tapicería","#315963",.88,"fabric"), rug=patterned("Alfombra","#7c7c77",.96,"fabric"), stoneDark=patterned("Piedra gris","#8e9998",.76,"stone"), paper=mat("Papel cálido","#e6e2d8",.94), plantMat=mat("Verde interior","#345344",.72);
scene.environmentTexture=BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/environmentSpecular.env",scene);scene.environmentIntensity=.62;
const ambient=new BABYLON.HemisphericLight("Luz cielo",new BABYLON.Vector3(0,1,0),scene);ambient.intensity=.88;ambient.diffuse=new BABYLON.Color3(.88,.94,.96);ambient.groundColor=new BABYLON.Color3(.22,.27,.29);
const sun=new BABYLON.DirectionalLight("Luz lateral",new BABYLON.Vector3(.6,-1,.5),scene);sun.position.set(-5,8,-4);sun.intensity=2.45;sun.diffuse=BABYLON.Color3.FromHexString("#fff0d8");
const shadow=new BABYLON.ShadowGenerator(1024,sun);shadow.useBlurExponentialShadowMap=true;shadow.blurKernel=24;

function box(name,w,h,d,x,y,z,m){const mesh=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);mesh.position.set(x,y,z);mesh.material=m;mesh.receiveShadows=true;shadow.addShadowCaster(mesh);return mesh}
function cyl(name,d,h,x,y,z,m){const mesh=BABYLON.MeshBuilder.CreateCylinder(name,{diameter:d,height:h,tessellation:32},scene);mesh.position.set(x,y,z);mesh.material=m;mesh.receiveShadows=true;shadow.addShadowCaster(mesh);return mesh}
function sign(text,x,y,z,w=2.5,rotY=0){const t=new BABYLON.DynamicTexture(text,{width:1024,height:256},scene,false);const c=t.getContext();c.fillStyle="#20383e";c.fillRect(0,0,1024,256);c.fillStyle="#e7e8dd";c.font="48px sans-serif";c.textAlign="center";c.fillText(text,512,147);t.update();const m=new BABYLON.StandardMaterial("Rótulo "+text,scene);m.diffuseTexture=t;m.emissiveColor=new BABYLON.Color3(.7,.7,.7);const p=BABYLON.MeshBuilder.CreatePlane(text,{width:w,height:w/4},scene);p.position.set(x,y,z);p.rotation.y=rotY;p.material=m;return p}

box("Suelo",8,.16,10,0,-.1,0,floor);box("Fondo",8,3.5,.18,0,1.75,4.5,wall);box("Pared izquierda",.18,3.5,10,-4,1.75,0,wall);box("Pared derecha",.18,3.5,10,4,1.75,0,wall);box("Pared trasera",8,3.5,.18,0,1.75,-5,wall);box("Techo",8,.1,10,0,3.55,0,wall);
for(let z=-4.5;z<4.5;z+=1.2)box("Junta",8,.003,.012,0,.001,z,graphite);
const glow=mat("Luminaria","#f5eedb",.4);glow.emissiveColor=new BABYLON.Color3(.9,.86,.72);
for(let x=-3;x<=3;x+=3)box("Línea de luz",.055,.028,7,x,3.46,0,glow);
for(const z of [-3.7,-1.2,1.3,3.7])box("Foseado de techo",6.7,.035,.055,0,3.43,z,graphite);
box("Zócalo fondo",7.7,.085,.03,0,.045,4.39,graphite);box("Zócalo trasero",7.7,.085,.03,0,.045,-4.89,graphite);

const glass=mat("Cristal","#b9d1d4",.1,.2);glass.alpha=.35;box("Ventana",.035,2.5,3,-3.86,1.8,.2,glass);
for(let z=-1.5;z<2;z+=1.1)box("Montante",.08,2.7,.045,-3.8,1.8,z,graphite);
for(let z=-1;z<3;z++)box("Arquitectura exterior",1.3,4+z*.4,.7,-5.5,1,z,wall);

for(const [x,label] of [[-2.15,"SALA DE ENTREVISTA"],[2.15,"ATENCIÓN AL CLIENTE"]]){
  box("Acceso "+label,1.8,2.65,.12,x,1.325,4.28,teal);
  for(const side of [-1,1])box("Jamba",.075,2.8,.2,x+side*.95,1.4,4.12,graphite);
  box("Dintel",2,.08,.2,x,2.8,4.12,graphite);box("Tirador",.035,.48,.12,x+.65,1.15,4.1,brass);
  sign(label,x,3.08,4.05,3);sign("DISPONIBLE",x,2.07,4.1,1.3);
}
box("Acceso despacho",.12,2.65,1.8,3.86,1.325,-1.5,teal);
for(const dz of [-.95,.95])box("Jamba despacho",.2,2.8,.075,3.78,1.4,-1.5+dz,graphite);
box("Dintel despacho",.2,.08,2,3.78,2.8,-1.5,graphite);box("Tirador despacho",.12,.48,.035,3.7,1.15,-.85,brass);
sign("FEEDBACK DEL RESPONSABLE",3.7,3.08,-1.5,3,Math.PI/2);sign("DISPONIBLE",3.7,2.07,-1.5,1.3,Math.PI/2);

// V2 del hall: composición abierta, pórticos, madera, piedra y luz cálida.
box("Banda frontal corporativa",7.45,.72,.10,0,3.14,4.30,graphite);
for(const x of [-3.55,-3.33,-3.11,-.98,-.76,-.54,.54,.76,.98,3.11,3.33,3.55]) box("Listón vertical frontal",.075,2.95,.10,x,1.48,4.18,oak);
for(const x of [-3.44,-3.22,-.87,-.65,.65,.87,3.22,3.44]) box("Luz vertical frontal",.024,2.45,.06,x,1.52,4.10,glow);

for(const x of [-2.15,2.15]){
  box("Pilar pétreo acceso",.28,3.10,.42,x-.99,1.55,4.03,stoneDark);
  box("Pilar pétreo acceso",.28,3.10,.42,x+.99,1.55,4.03,stoneDark);
  box("Cornisa pétrea acceso",2.24,.24,.42,x,3.02,4.03,stoneDark);
  box("Panel cabecera acceso",2.10,.46,.12,x,3.12,3.94,graphite);
}
box("Pilar despacho A",.42,3.10,.28,3.68,1.55,-2.49,stoneDark);
box("Pilar despacho B",.42,3.10,.28,3.68,1.55,-.51,stoneDark);
box("Cornisa despacho",.42,.24,2.24,3.68,3.02,-1.5,stoneDark);
for(const z of [-2.84,-2.62,-.38,-.16]) box("Listón despacho",.08,2.75,.075,3.72,1.45,z,oak);

for(const [name,x,z] of [["Luz entrevista",-2.15,3.25],["Luz cliente",2.15,3.25],["Luz recepción",2.6,-3.1],["Luz espera",-2.35,-3.0]]){
  const l=new BABYLON.PointLight(name,new BABYLON.Vector3(x,2.55,z),scene);
  l.diffuse=BABYLON.Color3.FromHexString("#ffd9ad");l.intensity=.82;l.range=4.4;
}

// Techo de listones sobre la zona de llegada.
for(let x=-3.55;x<=3.55;x+=.24) box("Listón techo hub",.075,.12,2.55,x,3.38,-3.45,oak);
for(const x of [-3.42,-1.70,0,1.70,3.42]) box("Luz techo hub",.035,.028,2.62,x,3.31,-3.45,glow);

// Recepción lateral: mantiene libre el eje central.
box("Frente recepción",2.35,.86,.58,2.52,.43,-3.42,teal);
box("Encimera recepción",2.58,.075,.78,2.52,.90,-3.42,oak);
box("Zócalo recepción",2.12,.08,.48,2.52,.05,-3.42,graphite);
for(let i=0;i<10;i++) box("Listón recepción",.055,.76,.04,1.62+i*.20,.48,-3.72,oak);
box("Panel recepción",2.70,1.55,.08,2.52,1.85,-4.12,teal);
sign("MISIÓN COMUNICACIÓN",2.52,2.12,-4.03,2.25,Math.PI);
sign("ENTORNO DE PRÁCTICA",2.52,1.70,-4.02,2.05,Math.PI);
box("Pantalla recepción",.58,.38,.05,2.20,1.16,-3.46,graphite);
box("Base pantalla recepción",.10,.22,.10,2.20,.99,-3.46,graphite);
box("Portadocumentos",.32,.12,.22,2.82,.99,-3.40,paper);

// Zona lounge a la izquierda.
box("Alfombra espera",3.35,.018,2.25,-2.05,.01,-3.25,rug);
for(const x of [-2.82,-1.48]){
  box("Asiento lounge",1.05,.20,.72,x,.42,-3.25,soft);
  box("Respaldo lounge",1.05,.72,.16,x,.83,-3.56,soft);
  box("Zócalo lounge",.88,.16,.52,x,.17,-3.25,graphite);
}
cyl("Mesa centro lounge",.82,.055,-2.14,.48,-2.48,oak);
cyl("Pie mesa lounge",.11,.44,-2.14,.24,-2.48,graphite);
cyl("Base mesa lounge",.48,.035,-2.14,.03,-2.48,graphite);
box("Revistas lounge",.46,.035,.30,-2.03,.53,-2.48,paper);

// Jardinera baja con vegetación más densa.
cyl("Jardinera baja",1.35,.34,-3.05,.17,-1.78,oak);
cyl("Macetero central",.82,.50,-3.05,.42,-1.78,graphite);
for(let i=0;i<10;i++){
  const a=i/10*Math.PI*2;
  const leaf=BABYLON.MeshBuilder.CreateSphere("Vegetación jardinera",{diameter:.48,segments:12},scene);
  leaf.scaling.set(.48,1.55,.42);leaf.position.set(-3.05+Math.cos(a)*.25,.88+(i%3)*.08,-1.78+Math.sin(a)*.25);
  leaf.rotation.z=Math.cos(a)*.28;leaf.material=plantMat;shadow.addShadowCaster(leaf);
}

// Revestimientos laterales y marca posterior.
box("Panel información",1.30,1.72,.09,-3.80,1.33,-3.52,graphite);
sign("3 EXPERIENCIAS",-3.73,1.72,-3.52,1.05,-Math.PI/2);
box("Revestimiento izquierdo",.10,2.35,2.45,-3.82,1.45,-3.30,stoneDark);
box("Revestimiento derecho",.10,2.35,2.45,3.82,1.45,-3.65,oak);
box("Muro marca posterior",4.25,1.25,.08,-.45,2.45,-4.84,teal);
sign("COMUNICACIÓN PROFESIONAL",-.45,2.55,-4.76,3.65,Math.PI);
for(let x=-3.2;x<=2.3;x+=.24) box("Listón mural posterior",.06,1.12,.08,x,2.45,-4.79,oak);

cyl("Mesa alta",.56,.055,.98,.92,-2.30,oak);
cyl("Pie mesa alta",.09,.84,.98,.46,-2.30,graphite);
cyl("Base mesa alta",.38,.03,.98,.03,-2.30,graphite);

const fallbackPlants=[];
for(const [x,z] of [[-3.4,3.6],[3.4,3.6],[-3.35,-4.1],[3.25,-4.1]]){
  const fallback=[];
  const pot=BABYLON.MeshBuilder.CreateCylinder("Maceta",{diameterTop:.42,diameterBottom:.56,height:.5,tessellation:32},scene);pot.position.set(x,.25,z);pot.material=graphite;fallback.push(pot);
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2;const leaf=BABYLON.MeshBuilder.CreateSphere("Follaje",{diameter:.42,segments:12},scene);leaf.scaling.set(.40,1.9,.28);leaf.rotation.z=Math.cos(a)*.48;leaf.rotation.x=Math.sin(a)*.18;leaf.position.set(x+Math.cos(a)*.22,.82+(i%3)*.11,z+Math.sin(a)*.22);leaf.material=plantMat;shadow.addShadowCaster(leaf);fallback.push(leaf)}
  fallbackPlants.push(fallback);
}

async function replaceFrontLeftPlant(){
  try{
    const container=await BABYLON.SceneLoader.LoadAssetContainerAsync(
      "./models/hub/","potted-plant-01-web.glb",scene
    );
    const entries=container.instantiateModelsToScene(n=>"preview-plant/"+n,false,{doNotInstantiate:false});
    const root=new BABYLON.TransformNode("preview-plant-front-left",scene);
    for(const node of entries.rootNodes) node.parent=root;
    const meshes=root.getChildMeshes().filter(m=>m.getTotalVertices()>0);
    if(!meshes.length) throw new Error("GLB sin geometría");
    const bounds=()=>{
      root.computeWorldMatrix(true);
      const min=new BABYLON.Vector3(Infinity,Infinity,Infinity),max=new BABYLON.Vector3(-Infinity,-Infinity,-Infinity);
      for(const m of meshes){m.computeWorldMatrix(true);const b=m.getBoundingInfo().boundingBox;min.minimizeInPlace(b.minimumWorld);max.maximizeInPlace(b.maximumWorld)}
      return {min,max,size:max.subtract(min)};
    };
    const original=bounds();root.scaling.setAll(1.32/original.size.y);
    const fitted=bounds();
    if(fitted.size.x>.8||fitted.size.z>.8) throw new Error("Huella excesiva");
    root.position.set(-3.4-(fitted.min.x+fitted.max.x)/2,-.02-fitted.min.y,3.6-(fitted.min.z+fitted.max.z)/2);
    for(const m of meshes){m.isPickable=false;m.checkCollisions=false;m.receiveShadows=true;shadow.addShadowCaster(m,false)}
    for(const m of fallbackPlants[0]){shadow.removeShadowCaster(m,false);m.setEnabled(false)}
  }catch(err){
    console.warn("No se pudo cargar la planta GLB; se conserva el fallback.",err);
  }
}
void replaceFrontLeftPlant();

const pipeline=new BABYLON.DefaultRenderingPipeline("Luz suave",true,scene,[camera]);pipeline.fxaaEnabled=true;pipeline.bloomEnabled=true;pipeline.bloomThreshold=1.2;pipeline.bloomWeight=.085;pipeline.bloomKernel=32;
engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize",()=>engine.resize());
</script>
</body>
</html>
